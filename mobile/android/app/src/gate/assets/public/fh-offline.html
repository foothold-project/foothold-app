<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 스크립트·네트워크 없음: 이 화면은 아무것도 보내지 않는다 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>FOOTHOLD · 연결 안 됨</title>
<style>
  :root { color-scheme: light dark; --bg: #F6F5F1; --fg: #12161D; --mute: #5b6470; --line: #d9d6cc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12161D; --fg: #F6F5F1; --mute: #a8b0ba; --line: #2b323d; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, sans-serif; }
  main { max-width: 34rem; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .tag { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 13px; color: var(--mute); }
  li { margin: 6px 0; }
  p.mute { color: var(--mute); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>관문에 연결하지 못했습니다</h1>
  <span class="tag">보기 전용 · 이 앱 안의 화면</span>
  <ul>
    <li>이 화면은 로봇에 어떤 명령도 보내지 않습니다.</li>
    <li>로봇 상태는 측정하지 못했습니다. 정지 여부를 포함해 알 수 없습니다.</li>
    <li>관문 주소·네트워크·인증서를 확인한 뒤 앱을 완전히 닫고 다시 여세요.</li>
  </ul>
  <p class="mute">개발용 A 연결(관문 주소 로드) 빌드에서만 보이는 화면입니다.</p>
</main>
</body>
</html>
