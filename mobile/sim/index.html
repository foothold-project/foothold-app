<!doctype html>
<html lang="ko" data-drive>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- 앱 안 번들만 읽는다(connect-src 'self'). wasm 컴파일 'wasm-unsafe-eval', mujoco.js(embind)의 new Function 때문에 'unsafe-eval' -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'">
<title>FOOTHOLD</title>
<link rel="stylesheet" href="../brand/tokens/foothold.tokens.css">
<style>
  /* 시뮬 조종 화면: 보이는 글자 0 — 아이콘·모양·색만. 이름은 aria-label(읽어 주기용)에만 */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14171c; color: #e6e8eb;
    touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }
  :root { --stick: clamp(110px, 38vmin, 160px); --edge: 16px; --t: calc(8px + env(safe-area-inset-top)); --stopc: #d32f2f; }
  button { display: grid; place-items: center; padding: 0; width: 52px; height: 52px; border-radius: 12px; color: #e6e8eb;
    background: rgb(20 23 28 / .72); border: 1px solid rgb(255 255 255 / .28); touch-action: manipulation; }
  button svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  button:disabled { opacity: .4; }
  #home { position: fixed; top: var(--t); left: calc(8px + env(safe-area-inset-left)); }
  /* STOP: 늘 보이는 빨간 팔각형, 오른쪽 위 맨 위 층 */
  #stop { position: fixed; z-index: 100; top: var(--t); right: calc(8px + env(safe-area-inset-right)); width: 72px; height: 72px; border: 0; background: none; color: #fff; }
  #stop svg { width: 72px; height: 72px; stroke-width: 0; }
  #stop .oct { fill: var(--stopc); stroke: #fff; stroke-width: 3; }
  #stop .bar { fill: #fff; }
  #stop[aria-pressed="true"] .oct { fill: #7f1d1d; stroke: #ff8a80; }
  #go { position: fixed; z-index: 99; top: calc(var(--t) + 4px); right: calc(92px + env(safe-area-inset-right)); width: 64px; height: 64px; background: #1b5e20; border-color: #81c784; }
  #go svg { width: 34px; height: 34px; fill: currentColor; stroke: none; }
  #btns { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--edge) + var(--stick) + 20px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }
  @media (orientation: landscape) { #btns { bottom: calc(var(--edge) + env(safe-area-inset-bottom)); } }
  #reset.fell { background: var(--stopc); border-color: #fff; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  .stick { position: fixed; bottom: calc(var(--edge) + env(safe-area-inset-bottom)); width: var(--stick); height: var(--stick); border-radius: 50%;
    background: rgb(255 255 255 / .08); border: 2px solid rgb(255 255 255 / .25); touch-action: none; }
  .stick.out { border-color: #ffb74d; }   /* 학습 범위 밖 명령(뒤·옆 걸음 등) */
  .stick svg { position: absolute; inset: 18%; width: 64%; height: 64%; fill: none; stroke: rgb(255 255 255 / .22); stroke-width: 2; pointer-events: none; }
  #stickL { left: calc(var(--edge) + env(safe-area-inset-left)); } #stickR { right: calc(var(--edge) + env(safe-area-inset-right)); }
  .stick b { position: absolute; left: 32%; top: 32%; width: 36%; height: 36%; border-radius: 50%; background: rgb(255 255 255 / .45); pointer-events: none; }
  body.stopped .stick { opacity: .3; }
  #busy { position: fixed; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px; border-radius: 50%; border: 4px solid rgb(255 255 255 / .2); border-top-color: #e6e8eb; animation: spin 1s linear infinite; pointer-events: none; }
  @keyframes spin { to { transform: rotate(1turn); } }
  #fail { position: fixed; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px; fill: none; stroke: var(--stopc); stroke-width: 3; pointer-events: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body class="stopped">
<button id="home" type="button" aria-label="시작 화면"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5.5 9.5V21h13V9.5"/></svg></button>
<button id="stop" type="button" aria-label="정지" aria-pressed="true"><svg viewBox="0 0 72 72"><path class="oct" d="M23 3h26l20 20v26L49 69H23L3 49V23z"/><rect class="bar" x="17" y="31" width="38" height="10" rx="2"/></svg></button>
<button id="go" type="button" aria-label="다시 시작" hidden><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
<div id="stickL" class="stick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg><b></b></div>
<div id="stickR" class="stick" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 9a8 8 0 0 1 14 0M19 9V4.5M19 9h-4.5M5 9V4.5M5 9h4.5"/></svg><b></b></div>
<div id="btns">
  <button id="cam" type="button" aria-label="위에서 보기" aria-pressed="false" disabled><svg viewBox="0 0 24 24"><path d="M12 3 3 7.5 12 12l9-4.5zM3 12l9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg></button>
  <button id="reset" type="button" aria-label="다시 세우기" disabled><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/></svg></button>
</div>
<div id="busy"></div>
<svg id="fail" viewBox="0 0 24 24" hidden><circle cx="12" cy="12" r="9"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>
<script type="module" src="main.js"></script>
</body>
</html>
