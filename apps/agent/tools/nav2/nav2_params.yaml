# A3a-0 §4/5/7. GT map->odom has ONE writer (live_map); no AMCL/SLAM/map_server.
# base_link does not exist in the source. Use the actual base_footprint TF;
# do NOT add a guessed base_link transform or another map->odom broadcaster.
# Conservative Go2 test envelope: front/back .5m, lateral .6m (reviewed GT
# clearance tool). Circumscribed radius hypot(.5,.6)=.781025m, rounded UP .782.
# This is a safety envelope, not a measured chassis/footstep guarantee.
controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false # Jazzy TwistPublisher parameter; type fixed + graph checked
    controller_frequency: 20.0
    odom_topic: /fh_nav/odom
    min_x_velocity_threshold: 0.0
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.0
    progress_checker_plugins: [progress]
    goal_checker_plugins: [goal]
    controller_plugins: [FollowPath]
    progress:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 5.0
    goal:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.2617993877991494
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.6 # only tested nonzero forward command; Core alphabet
      lookahead_dist: 1.2 # nominal .6/.5 radius; turns still disabled by adapter
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: false # in-place turns are unverified
      allow_reversing: false
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      min_approach_linear_velocity: 0.05 # lower requests are REJECTED, never boosted
      approach_velocity_scaling_dist: 0.3
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.30
      use_astar: true
      allow_unknown: false
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /fh_nav/odom
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    enable_stamped_cmd_vel: false
    behavior_plugins: [] # no spin, backup, drive-on-heading recovery
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.782
      track_unknown_space: true
      plugins: [obstacles, inflation]
      obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /v2_map/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 5.0
          raytrace_max_range: 6.0
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.0 # > circumscribed .782; GT support gate is additional
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      robot_radius: 0.782
      track_unknown_space: true
      plugins: [static, obstacles, inflation]
      static:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /v2_map/map
        map_subscribe_transient_local: true
      obstacles:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /v2_map/scan
          data_type: LaserScan
          clearing: true
          marking: true
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.0
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
