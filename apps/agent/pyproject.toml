[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foothold-agent"
version = "0.1.0"
description = "FOOTHOLD robot agent safety Core (offline skeleton)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["foothold_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
