[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "foothold-agent"
version = "0.2.0"
description = "FOOTHOLD robot agent safety Core and ROS-free server link"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
link = ["websockets==15.0.1"]
discovery = ["zeroconf==0.148.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["foothold_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
