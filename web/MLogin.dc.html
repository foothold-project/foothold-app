<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>휴대폰 — 로그인</title>
<script src="./dc.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.fh{--bg:#0B0E11;--panel:#12171C;--panel2:#182028;--line:#26313A;--line2:#34424D;--text:#E6EBEF;--muted:#9AA7B3;--accent:#38C6D9;--on-accent:#061014;--ok:#5AA9FF;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.fh.light{--bg:#EDEFEA;--panel:#FFFFFF;--panel2:#F5F6F2;--line:#D7DBD3;--line2:#C2C8BF;--text:#12171C;--muted:#4F5A64;--accent:#006D7A;--on-accent:#FFFFFF;--ok:#1F5FBF}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
button,input{font:inherit;color:inherit}
.lbl{font-size:13px;color:var(--muted)}
.inp{height:52px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);font-size:16px;box-sizing:border-box;width:100%}
</style>
</helmet>
<div class="{{themeClass}}" style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden">
  <div style="position:relative;height:250px;background:#071014;color:#E6EBEF;padding:44px 24px 24px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden">
    <svg viewBox="0 0 390 250" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
      <g fill="none" stroke="#38C6D9" stroke-opacity=".14" stroke-width="1.5">
        <path d="M-20 230 C80 200 160 230 240 190 S340 140 410 160"></path><path d="M-20 200 C70 170 170 195 250 155 S350 110 410 125"></path><path d="M-20 170 C60 145 180 160 260 120 S360 80 410 90"></path><path d="M-20 140 C50 120 190 125 270 85 S370 50 410 55"></path>
      </g>
      <path d="M110 200 L170 150 L210 170 L280 100" fill="none" stroke="#38C6D9" stroke-opacity=".4" stroke-width="2"></path>
      <circle cx="280" cy="100" r="6" fill="#38C6D9"></circle>
    </svg>
    <div style="position:relative;display:flex;align-items:center;gap:10px">
      <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 23 L10 9 L14 16 L18 6 L25 23 Z" fill="none" stroke="#38C6D9" stroke-width="2.2" stroke-linejoin="round"></path><circle cx="18" cy="6" r="2.2" fill="#38C6D9"></circle></svg>
      <span style="font-weight:700;letter-spacing:.14em;font-size:16px">FOOTHOLD</span>
    </div>
    <span style="position:relative;font-size:24px;font-weight:700;line-height:1.35">사람이 들어가기 전에,<br>로봇이 먼저.</span>
  </div>

  <form style="flex:1;display:flex;flex-direction:column;gap:14px;padding:22px 20px 24px">
    <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)">
      <span style="color:var(--ok)">●</span>
      <span style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0"><span style="font-size:14px;font-weight:600">현장 서버 · [서버 주소]</span><span class="lbl" style="font-size:12px">같은 Wi-Fi · 인증서 확인됨</span></span>
      <a href="#" style="font-size:13px;color:var(--accent);padding:12px 0">바꾸기</a>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px"><label class="lbl" for="mid">계정</label><input id="mid" class="inp" value="doyun.kim" autocomplete="username"></div>
    <div style="display:flex;flex-direction:column;gap:6px"><label class="lbl" for="mpw">비밀번호</label><input id="mpw" class="inp" type="password" value="password" autocomplete="current-password"></div>
    <label style="display:flex;gap:10px;align-items:center;font-size:14px;min-height:44px"><input type="checkbox" checked="{{ true }}" style="width:20px;height:20px;accent-color:var(--accent)">이 휴대폰에서 로그인 유지</label>
    <a href="MHome.dc.html" style="height:56px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:auto">로그인</a>
    <a href="MHome.dc.html" style="height:44px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none">보기 전용으로 들어가기</a>
    <span class="lbl" style="font-size:12px;text-align:center;line-height:1.5">보기 전용도 STOP은 누를 수 있습니다</span>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["밝은","어두운"],"default":"밝은"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.theme ?? '밝은') === '밝은' ? 'fh light' : 'fh' };
  }
}
</script>
</body>
</html>
