<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관제 — 로그인</title>
<script src="./dc.js"></script>
<script src="./live.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.fh{--bg:#0B0E11;--panel:#12171C;--panel2:#182028;--line:#26313A;--line2:#34424D;--text:#E6EBEF;--muted:#9AA7B3;--accent:#38C6D9;--on-accent:#061014;--ok:#5AA9FF;--warn:#FFB547;--bad:#FF5A52;--acc-bg:rgba(56,198,217,.12);font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.fh.light{--bg:#EDEFEA;--panel:#FFFFFF;--panel2:#F5F6F2;--line:#D7DBD3;--line2:#C2C8BF;--text:#12171C;--muted:#4F5A64;--accent:#006D7A;--on-accent:#FFFFFF;--ok:#1F5FBF;--warn:#9A5800;--bad:#B3261E;--acc-bg:rgba(0,109,122,.08)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
.lbl{font-size:13px;color:var(--muted)}
.inp{height:48px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--panel2);font-size:15px;box-sizing:border-box;width:100%}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
</style>
</helmet>
<div class="{{themeClass}}" style="min-height:100vh;display:flex;flex-wrap:wrap">
  <section aria-label="소개" style="flex:1 1 520px;min-height:360px;position:relative;overflow:hidden;background:#071014;color:#E6EBEF;display:flex;flex-direction:column;justify-content:space-between;padding:48px">
    <svg viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
      <g fill="none" stroke="#38C6D9" stroke-opacity=".13" stroke-width="1.5">
        <path d="M-40 760 C120 700 220 760 340 700 S560 560 840 610"></path>
        <path d="M-40 700 C110 640 230 690 350 630 S570 500 840 545"></path>
        <path d="M-40 640 C100 585 240 620 360 560 S580 440 840 480"></path>
        <path d="M-40 580 C90 530 250 550 370 490 S590 380 840 415"></path>
        <path d="M-40 520 C80 475 260 480 380 420 S600 320 840 350"></path>
        <path d="M-40 460 C70 420 270 410 390 350 S610 260 840 285"></path>
        <path d="M-40 400 C60 365 280 340 400 280 S620 200 840 220"></path>
        <path d="M-40 340 C50 310 290 270 410 210 S630 140 840 155"></path>
      </g>
      <g fill="none" stroke="#38C6D9" stroke-opacity=".35" stroke-width="2"><path d="M210 620 L300 520 L360 560 L470 430"></path></g>
      <g fill="#38C6D9"><circle cx="210" cy="620" r="6"></circle><circle cx="300" cy="520" r="6"></circle><circle cx="360" cy="560" r="6"></circle><circle cx="470" cy="430" r="9"></circle></g>
    </svg>
    <div style="position:relative;display:flex;align-items:center;gap:12px">
      <svg width="36" height="36" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 23 L10 9 L14 16 L18 6 L25 23 Z" fill="none" stroke="#38C6D9" stroke-width="2.2" stroke-linejoin="round"></path><circle cx="18" cy="6" r="2.2" fill="#38C6D9"></circle></svg>
      <span style="font-weight:700;letter-spacing:.14em;font-size:18px">FOOTHOLD</span>
    </div>
    <div style="position:relative;display:flex;flex-direction:column;gap:14px;max-width:460px">
      <h1 style="margin:0;font-size:40px;line-height:1.25;font-weight:700;letter-spacing:-.01em;text-wrap:balance">사람이 들어가기 전에,<br>로봇이 먼저.</h1>
      <p style="margin:0;font-size:16px;line-height:1.65;color:#B5C1CB">사족보행 로봇으로 위험한 현장을 먼저 걷고, 보고, 재고, 기록합니다.</p>
    </div>
    <span class="mono" style="position:relative;font-size:12px;color:#93A3AE">인공지능사관학교 7기 · FOOTHOLD 팀</span>
  </section>

  <section aria-label="로그인" style="flex:1 1 480px;display:flex;align-items:center;justify-content:center;padding:48px 24px;background:var(--bg)">
    <form style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <h2 style="margin:0;font-size:26px;font-weight:700">로그인</h2>
        <span class="lbl">현장 서버에 연결해 로봇을 보고 조종합니다</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel)">
        <span style="color:var(--ok)">●</span>
        <span style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0"><span style="font-size:14px;font-weight:600">현장 서버 · [서버 주소]</span><span class="lbl" style="font-size:12px">인증서 확인됨 · 로봇 1대 연결됨</span></span>
        <a href="#" style="font-size:13px;color:var(--accent)">바꾸기</a>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px"><label class="lbl" for="id">계정</label><input id="id" class="inp" value="doyun.kim" autocomplete="username"></div>
      <div style="display:flex;flex-direction:column;gap:6px"><label class="lbl" for="pw">비밀번호</label><input id="pw" class="inp" type="password" value="password" autocomplete="current-password"></div>
      <div style="display:flex;flex-direction:column;gap:6px"><label class="lbl" for="dv">이 기기 이름 · 기록에 남습니다</label><input id="dv" class="inp" value="관제 노트북 1"></div>
      <label style="display:flex;gap:10px;align-items:center;font-size:14px"><input type="checkbox" checked="{{ true }}" style="width:18px;height:18px;accent-color:var(--accent)">이 기기에서 로그인 유지 (12시간)</label>
      <a href="Main.dc.html" style="height:52px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;text-decoration:none">로그인</a>
      <div style="display:flex;justify-content:space-between;gap:12px;font-size:13px">
        <a href="Main.dc.html" style="color:var(--accent)">보기 전용으로 들어가기</a>
        <span class="lbl">5번 틀리면 1분 잠김</span>
      </div>
      <span class="lbl" style="font-size:12px;line-height:1.6;padding-top:6px;border-top:1px solid var(--line)">보기 전용 사용자도 STOP은 누를 수 있습니다. 조종은 로그인한 한 사람만, «조종권 받기»를 누른 뒤에 할 수 있습니다.</span>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["어두운","밝은"],"default":"어두운"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.theme ?? '어두운') === '밝은' ? 'fh light' : 'fh' };
  }
}
</script>
</body>
</html>
