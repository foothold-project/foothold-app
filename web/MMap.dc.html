<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>휴대폰 — 지도</title>
<script src="./dc.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.fh{--bg:#0B0E11;--panel:#12171C;--panel2:#182028;--line:#26313A;--line2:#34424D;--text:#E6EBEF;--muted:#9AA7B3;--accent:#38C6D9;--on-accent:#061014;--ok:#5AA9FF;--warn:#FFB547;--bad:#FF5A52;--stop:#D7261E;--map:#0E1317;--wall:#4C5A66;--gridc:rgba(154,167,179,.07);font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
.fh.light{--bg:#EDEFEA;--panel:#FFFFFF;--panel2:#F5F6F2;--line:#D7DBD3;--line2:#C2C8BF;--text:#12171C;--muted:#4F5A64;--accent:#006D7A;--on-accent:#FFFFFF;--ok:#1F5FBF;--warn:#9A5800;--bad:#B3261E;--stop:#C8201A;--map:#F8F9F5;--wall:#7C8790;--gridc:rgba(18,23,28,.06)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.lbl{font-size:12px;color:var(--muted)}
.tabb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:52px;font-size:11px;color:var(--muted);text-decoration:none}
.tabb.cur{color:var(--accent);font-weight:600}
.fab{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center}
</style>
</helmet>
<div class="{{themeClass}}" style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;gap:10px;padding:14px 16px 10px">
    <div style="display:flex;flex-direction:column;gap:2px;flex:1">
      <span style="font-size:18px;font-weight:700">지도</span>
      <span class="lbl">B1 펌프실 v3 · <span style="color:var(--ok)">●</span> 위치 신뢰 높음</span>
    </div>
    <button class="fab" aria-label="지도 레이어"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg></button>
  </header>

  <div style="position:relative;margin:0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:1;min-height:0">
    <svg viewBox="600 70 380 470" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%" role="img" aria-label="지도: 로봇 위치와 새로 찍은 목표, 미리 본 경로">
      <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" style="stroke:var(--gridc)" stroke-width="1"></path></pattern>
      <pattern id="hw" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="10" style="stroke:var(--warn)" stroke-width="2" stroke-opacity=".32"></line></pattern></defs>
      <rect x="0" y="0" width="1000" height="620" style="fill:var(--map)"></rect>
      <rect x="0" y="0" width="1000" height="620" fill="url(#grid)"></rect>
      <rect x="690" y="420" width="267" height="157" fill="url(#hw)"></rect>
      <g style="stroke:var(--wall)" stroke-width="6" fill="none" stroke-linecap="square">
        <rect x="40" y="40" width="920" height="540"></rect>
        <path d="M500 300H770M830 300H960M640 40V300M380 380H750M810 380H960M600 380V580"></path>
      </g>
      <g style="stroke:var(--wall)" stroke-width="2" fill="none" opacity=".8"><path d="M660 90H940M660 120H940M660 230H940"></path><rect x="830" y="470" width="96" height="76" stroke-dasharray="6 5"></rect></g>
      <g font-family="IBM Plex Sans KR, sans-serif" font-size="16" style="fill:var(--muted)"><text x="660" y="74">배관 구역</text><text x="620" y="412">집수정</text><text x="660" y="335">복도</text></g>
      <polyline points="780,404 780,340 800,340 800,200 880,200 880,176" fill="none" style="stroke:var(--accent)" stroke-width="5" stroke-dasharray="10 7" stroke-linejoin="round"></polyline>
      <g transform="translate(880 160)"><path d="M0 18 C-10 4 -14 -2 -14 -8 A14 14 0 0 1 14 -8 C14 -2 10 4 0 18 Z" style="fill:var(--accent)"></path><circle cy="-8" r="5" style="fill:var(--map)"></circle></g>
      <g transform="translate(780 404) rotate(180)"><path d="M0 0 L-40 -84 A92 92 0 0 1 40 -84 Z" style="fill:var(--accent)" opacity=".14"></path><circle r="18" style="fill:var(--accent)" opacity=".2"></circle><path d="M0 -15 L11 11 L0 5 L-11 11 Z" style="fill:var(--accent);stroke:var(--map)" stroke-width="2"></path></g>
    </svg>
    <div style="position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px">
      <button class="fab" aria-label="로봇 위치로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg></button>
      <button class="fab" aria-label="확대"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      <button class="fab" aria-label="축소"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
    </div>
    <span style="position:absolute;left:10px;top:10px;font-size:12px;padding:6px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line2)">지도를 눌러 목표를 고르세요</span>
  </div>

  <section aria-label="고른 목표" style="margin:10px 16px 0;padding:14px;border:1px solid var(--accent);border-radius:12px;background:var(--panel);display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
      <b style="font-size:16px">배관 구역 안쪽</b>
      <span class="mono lbl">x 41.2 · y 6.4</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px">
      <span><span class="lbl">거리</span> <b class="mono">19 m</b></span>
      <span><span class="lbl">예상</span> <b class="mono">1분</b></span>
      <span><span style="color:var(--ok)">●</span> 경로 검사 통과</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px">
      <button style="height:52px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);font-weight:600">취소</button>
      <button style="height:52px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px">이 목표로 이동</button>
    </div>
    <span class="lbl" style="text-align:center">지도를 누르기만 해서는 움직이지 않습니다</span>
  </section>

  <nav aria-label="주 메뉴" style="display:flex;border-top:1px solid var(--line);background:var(--panel);margin-top:10px">
    <a class="tabb" href="MHome.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>현황</a>
    <a class="tabb cur" href="MMap.dc.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"></path></svg>지도</a>
    <a class="tabb" href="MFinding.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="7" y="7" width="10" height="10" transform="rotate(45 12 12)"></rect></svg>발견물</a>
    <a class="tabb" href="MHistory.dc.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6"></path></svg>기록</a>
  </nav>
  <div style="padding:8px 16px 18px;background:var(--panel)">
    <button aria-label="비상 정지" style="width:100%;height:64px;border:0;border-radius:12px;background:var(--stop);color:#FFFFFF;display:flex;align-items:center;justify-content:center;gap:12px">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z" fill="none" stroke="#FFFFFF" stroke-width="2"></path><rect x="8" y="8" width="8" height="8" fill="#FFFFFF"></rect></svg>
      <span style="font-weight:700;font-size:22px;letter-spacing:.1em">STOP</span><span style="font-size:13px">전체 정지</span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["밝은","어두운"],"default":"밝은"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.theme ?? '밝은') === '밝은' ? 'fh light' : 'fh' };
  }
}
</script>
</body>
</html>
